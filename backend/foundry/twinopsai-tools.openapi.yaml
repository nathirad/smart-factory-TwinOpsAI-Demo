openapi: 3.0.3
info:
  title: TwinOpsAI Product Agent Tools
  version: 1.0.0
  description: Tool API for TwinOpsAI Foundry production agents.

servers:
  - url: https://YOUR_BACKEND_PUBLIC_URL
    description: TwinOpsAI production backend

security:
  - ApiKeyAuth: []

paths:
  /api/fabric/telemetry/latest:
    get:
      operationId: get_latest_telemetry
      summary: Get latest machine telemetry from Microsoft Fabric KQL.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
        - name: minutes
          in: query
          schema:
            type: integer
            default: 1440
      responses:
        "200":
          description: Latest telemetry rows.

  /api/fabric/anomalies/latest:
    get:
      operationId: get_latest_anomalies
      summary: Get latest anomaly candidates from Fabric telemetry.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: minutes
          in: query
          schema:
            type: integer
            default: 1440
      responses:
        "200":
          description: Latest anomaly records.

  /api/twins/{twin_id}/dependencies:
    get:
      operationId: get_twin_dependencies
      summary: Get Azure Digital Twins dependency impact for a machine.
      parameters:
        - name: twin_id
          in: path
          required: true
          schema:
            type: string
            example: motor-A
      responses:
        "200":
          description: Digital twin dependency graph.

  /api/analyze:
    get:
      operationId: get_maintenance_recommendation
      summary: Get maintenance recommendation with SOP/RAG evidence.
      responses:
        "200":
          description: AI maintenance recommendation.

  /api/reports:
    get:
      operationId: get_business_report
      summary: Get business impact, ROI, roadmap, and operational report.
      responses:
        "200":
          description: Business impact report.

  /api/work-orders:
    post:
      operationId: create_work_order
      summary: Create a maintenance work order from recommendation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recommendation_id
                - action
              properties:
                recommendation_id:
                  type: integer
                  example: 1
                action:
                  type: string
                  example: Inspect Motor A bearing and reduce load by 15%
                assignee:
                  type: string
                  example: Maintenance Team
                due:
                  type: string
                  example: Today
                note:
                  type: string
                  example: Generated by Foundry Orchestrator Agent
      responses:
        "200":
          description: Created work order.

  /api/integrations/status:
    get:
      operationId: get_integration_status
      summary: Check which Azure integrations are configured.
      responses:
        "200":
          description: Integration status.

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
